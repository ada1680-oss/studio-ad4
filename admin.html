<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STUDIO AD4 掲示板管理</title><style>body{font:16px sans-serif;max-width:850px;margin:25px auto;padding:15px;background:#e8edf7;color:#172a52}input,textarea,button{font:inherit;padding:9px;margin:5px}input{width:min(95%,500px)}textarea{width:95%;min-height:60px}article{background:white;padding:15px;margin:12px 0;border:1px solid #9caac5}button{cursor:pointer}p{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>掲示板管理</h1><p>Cloudflareで設定したADMIN_TOKENを入力してください。トークンはこの画面に保存されません。</p><input id="token" type="password" placeholder="ADMIN_TOKEN"><button id="load">投稿一覧を取得</button><div id="status" role="status"></div><div id="posts"></div><script>const $=id=>document.getElementById(id);function auth(){return {'Authorization':'Bearer '+$('token').value}}async function call(method,url,data){const r=await fetch(url,{method,headers:{...auth(),...(data?{'Content-Type':'application/json'}:{})},body:data?JSON.stringify(data):undefined});const x=await r.json();if(!r.ok)throw Error(x.error||'通信エラー');return x}async function load(){try{const x=await call('GET','/api/admin/posts');$('posts').replaceChildren();for(const p of x.posts){const article=document.createElement('article');const title=document.createElement('h3');title.textContent='#'+p.id+' '+p.work+' / '+p.category+' / '+p.name+' ['+p.status+']';const body=document.createElement('p');body.textContent=p.body;const reply=document.createElement('textarea');reply.placeholder='STUDIO AD4からの返信';reply.value=p.reply||'';article.append(title,body,reply);for(const [label,status] of [['承認','approved'],['非公開','rejected']]){const btn=document.createElement('button');btn.textContent=label;btn.onclick=async()=>{try{await call('PATCH','/api/admin/posts',{id:p.id,status,reply:reply.value});await load()}catch(e){$('status').textContent=e.message}};article.append(btn)}const del=document.createElement('button');del.textContent='削除';del.onclick=async()=>{if(!confirm('投稿を削除しますか？'))return;try{await call('DELETE','/api/admin/posts?id='+p.id);await load()}catch(e){$('status').textContent=e.message}};article.append(del);$('posts').append(article)}$('status').textContent=x.posts.length+'件取得しました'}catch(e){$('status').textContent=e.message}}$('load').onclick=load;</script></html>
